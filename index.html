<style>
:root{
  --paper:#FBF8F3; --card:#FFFFFF; --raise:#F4EFE6;
  --ink:#1F2A24; --ink-2:#4E5B54; --ink-3:#7C8781;
  --rule:#E2DACC; --rule-2:#EFE9DE;
  --accent:#8A6A34; --accent-ink:#6B5127; --accent-wash:#F5EDDD;
  --green:#3E5C4B; --green-wash:#E9F0EA;
  --shadow:0 1px 2px rgba(31,42,36,.05), 0 8px 24px -12px rgba(31,42,36,.18);
  --r:14px; --r-s:9px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme=dark]{
  --paper:#131714; --card:#1B211D; --raise:#222925;
  --ink:#E9E5DC; --ink-2:#A9B3AC; --ink-3:#7C8781;
  --rule:#2C3430; --rule-2:#242B27;
  --accent:#C9A45C; --accent-ink:#DCBE7E; --accent-wash:#2A2519;
  --green:#8FBFA2; --green-wash:#1C2620;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow-wrap:break-word;
}
a{color:var(--accent-ink); text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; line-height:1.22; margin:0}
h1{font-size:clamp(1.7rem,4.4vw,2.5rem); letter-spacing:-.01em}
h2{font-size:1.32rem}
h3{font-size:1.05rem}
button{font:inherit; color:inherit; cursor:pointer}
img{max-width:100%; display:block}

/* ── layout ─────────────────────────────────────────────────────────── */
.wrap{max-width:1180px; margin:0 auto; padding:0 clamp(14px,3vw,28px)}
header.site{
  position:sticky; top:0; z-index:50; background:color-mix(in srgb,var(--paper) 88%, transparent);
  backdrop-filter:saturate(1.6) blur(12px); border-bottom:1px solid var(--rule);
}
.bar{display:flex; align-items:center; gap:14px; height:60px}
.brand{display:flex; align-items:center; gap:9px; font-family:var(--serif); font-size:1.06rem; font-weight:600; color:var(--ink); white-space:nowrap}
.brand:hover{text-decoration:none}
.brand .mark{width:26px;height:26px;flex:0 0 26px; color:var(--green)}
nav.main{display:flex; gap:2px; margin-left:auto; align-items:center}
nav.main a{
  padding:7px 11px; border-radius:99px; font-size:.9rem; color:var(--ink-2); font-weight:500;
}
nav.main a:hover{background:var(--raise); text-decoration:none; color:var(--ink)}
nav.main a[aria-current=page]{background:var(--green-wash); color:var(--green)}
.iconbtn{
  display:grid; place-items:center; width:34px;height:34px; border-radius:99px;
  border:1px solid var(--rule); background:var(--card); color:var(--ink-2); flex:0 0 auto;
}
.iconbtn:hover{color:var(--ink); border-color:var(--ink-3)}
#navToggle{display:none}
main{padding:26px 0 80px; min-height:60vh}

/* ── generic bits ───────────────────────────────────────────────────── */
.card{background:var(--card); border:1px solid var(--rule); border-radius:var(--r); box-shadow:var(--shadow)}
.pad{padding:clamp(16px,2.4vw,24px)}
.muted{color:var(--ink-3)}
.small{font-size:.86rem}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:99px;
  background:var(--raise); border:1px solid var(--rule); font-size:.78rem; color:var(--ink-2);
  white-space:nowrap;
}
.chip.status-unknown{background:var(--raise); color:var(--ink-3)}
.chip.status-reported{background:var(--accent-wash); color:var(--accent-ink); border-color:transparent}
.chip.status-confirmed{background:var(--green-wash); color:var(--green); border-color:transparent}
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:8px 15px; border-radius:99px;
  border:1px solid var(--rule); background:var(--card); font-size:.9rem; font-weight:500;
}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--green); color:#fff; border-color:transparent}
html[data-theme=dark] .btn.primary{color:#12201a}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 11px; font-size:.82rem}
.btn:disabled{opacity:.4; cursor:default}
.btn:disabled:hover{border-color:var(--rule)}
input,select,textarea{
  font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--rule);
  border-radius:var(--r-s); padding:9px 12px; width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green); outline-offset:1px; border-color:transparent}
.sechead{display:flex; align-items:baseline; gap:12px; margin:0 0 12px}
.sechead h2{flex:0 0 auto}
.sechead .rule{flex:1; height:1px; background:var(--rule)}
.grid{display:grid; gap:14px}
.notice{
  border-left:3px solid var(--accent); background:var(--accent-wash); color:var(--accent-ink);
  padding:12px 15px; border-radius:0 var(--r-s) var(--r-s) 0; font-size:.9rem;
}

/* ── avatars ────────────────────────────────────────────────────────── */
.av{
  border-radius:50%; overflow:hidden; background:var(--raise); flex:0 0 auto;
  border:1px solid var(--rule); display:grid; place-items:center; position:relative;
}
.av svg{width:100%;height:100%; display:block}
.av img{position:absolute; inset:0; width:100%;height:100%; object-fit:cover}
.sil-bg{fill:var(--rule-2)} .sil-fg{fill:var(--ink-3); opacity:.55}

/* ── person chips / lists ───────────────────────────────────────────── */
.plist{display:flex; flex-wrap:wrap; gap:8px}
.pchip{
  display:inline-flex; align-items:center; gap:9px; padding:5px 13px 5px 5px; border-radius:99px;
  border:1px solid var(--rule); background:var(--card); color:var(--ink); font-size:.9rem;
}
.pchip:hover{border-color:var(--green); text-decoration:none; background:var(--green-wash)}
.pchip .av{width:28px;height:28px}
.pchip .sub{color:var(--ink-3); font-size:.78rem}

/* ── home ───────────────────────────────────────────────────────────── */
.hero{text-align:center; padding:clamp(18px,5vw,44px) 0 clamp(14px,3vw,26px)}
.hero .tag{font-family:var(--serif); font-style:italic; color:var(--accent-ink); font-size:1.05rem; letter-spacing:.02em}
.hero p.intro{max-width:62ch; margin:16px auto 0; color:var(--ink-2)}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:12px; margin-top:26px}
.stat{text-align:center; padding:16px 10px}
.stat b{display:block; font-family:var(--serif); font-size:1.9rem; line-height:1.1; color:var(--green)}
.stat span{font-size:.78rem; color:var(--ink-3); text-transform:uppercase; letter-spacing:.07em}
.branchgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px}

/* ── tree chart ─────────────────────────────────────────────────────── */
.treebar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px}
.treebar select{width:auto; min-width:150px; max-width:min(48vw,260px); padding:6px 10px; font-size:.86rem}
.viewport{
  overflow:auto; background:var(--card); border:1px solid var(--rule); border-radius:var(--r);
  box-shadow:var(--shadow); padding:26px 18px;
  background-image:radial-gradient(var(--rule-2) 1px, transparent 1px); background-size:22px 22px;
}
.chartscale{transform-origin:top left; transition:transform .18s ease; display:block; width:100%}
/* max-content lets the chart grow past the frame instead of overflowing a
   centred flex row, which would make it impossible to measure. */
.chart{width:max-content; min-width:100%}
.chart ul{display:flex; justify-content:center; padding:26px 0 0; margin:0; position:relative; list-style:none}
.chart>ul{padding-top:0}
.chart li{list-style:none; position:relative; padding:26px 7px 0; text-align:center}
.chart li::before,.chart li::after{
  content:''; position:absolute; top:0; right:50%; border-top:2px solid var(--rule); width:50%; height:26px;
}
.chart li::after{right:auto; left:50%; border-left:2px solid var(--rule)}
.chart li:only-child{padding-top:0}
.chart li:only-child::before,.chart li:only-child::after{display:none}
.chart li:first-child::before,.chart li:last-child::after{border:0 none}
.chart li:last-child::before{border-right:2px solid var(--rule); border-radius:0 7px 0 0}
.chart li:first-child::after{border-radius:7px 0 0 0}
.chart ul ul::before{
  content:''; position:absolute; top:0; left:50%; border-left:2px solid var(--rule); width:0; height:26px;
}
/* wraps a person card, or two who are parents of the same children */
.couple{display:inline-flex; position:relative}
.joint{align-self:center; width:20px; height:2px; background:var(--rule); flex:0 0 20px}
.tnode{
  display:flex; flex-direction:column; align-items:center; gap:6px; width:118px; padding:11px 8px 10px;
  background:var(--card); border:1px solid var(--rule); border-radius:var(--r-s); color:var(--ink);
  position:relative; transition:border-color .15s, box-shadow .15s;
}
.tnode:hover{border-color:var(--green); box-shadow:0 0 0 3px var(--green-wash); text-decoration:none}
.tnode.is-focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-wash)}
.tnode .av{width:46px;height:46px}
.tnode .nm{font-size:.83rem; font-weight:600; line-height:1.25; font-family:var(--serif)}
.tnode .yr{font-size:.7rem; color:var(--ink-3)}
.tnode .gen{
  position:absolute; top:-7px; left:-7px; width:19px;height:19px; border-radius:50%;
  background:var(--raise); border:1px solid var(--rule); font-size:.62rem; display:grid; place-items:center;
  color:var(--ink-3); font-weight:600;
}
.expander{
  position:absolute; bottom:-12px; left:50%; transform:translateX(-50%);
  min-width:24px; height:22px; padding:0 7px; border-radius:99px; background:var(--card);
  border:1px solid var(--rule); font-size:.68rem; font-weight:700; color:var(--ink-2);
  display:grid; place-items:center; z-index:3; line-height:1;
}
.expander:hover{border-color:var(--green); color:var(--green)}

/* ── outline view ───────────────────────────────────────────────────── */
.outline, .outline ul{list-style:none; margin:0; padding:0}
.outline ul{margin-left:15px; padding-left:15px; border-left:1px solid var(--rule)}
.outline li{margin:3px 0}
.orow{display:flex; align-items:center; gap:9px; padding:5px 8px; border-radius:var(--r-s)}
.orow:hover{background:var(--raise); text-decoration:none}
.orow .av{width:30px;height:30px}
.orow .nm{font-weight:600; font-size:.93rem}
.otog{
  width:20px;height:20px; border-radius:5px; border:1px solid var(--rule); background:var(--card);
  display:grid; place-items:center; font-size:.7rem; color:var(--ink-2); flex:0 0 auto; line-height:1;
}

/* ── profile ────────────────────────────────────────────────────────── */
.phead{display:flex; gap:clamp(14px,3vw,26px); align-items:flex-start; flex-wrap:wrap}
.phead .av{width:clamp(84px,18vw,124px); height:clamp(84px,18vw,124px)}
.phead .who{flex:1 1 260px; min-width:0}
.phead h1{margin-bottom:6px}
.metaline{display:flex; flex-wrap:wrap; gap:7px; margin-top:11px}
.crumb{font-size:.82rem; color:var(--ink-3); margin-bottom:14px; display:flex; flex-wrap:wrap; gap:5px; align-items:center}
.crumb a{color:var(--ink-2)}
.crumb .sep{opacity:.5}
.cols{display:grid; grid-template-columns:1fr; gap:16px}
@media(min-width:900px){ .cols{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)} }
.dl{display:grid; grid-template-columns:auto 1fr; gap:6px 16px; font-size:.93rem; margin:0}
.dl dt{color:var(--ink-3); font-size:.83rem; padding-top:2px}
.dl dd{margin:0}
.rows{border-top:1px solid var(--rule-2)}
.row{padding:11px 0; border-bottom:1px solid var(--rule-2)}
.row .t{font-weight:600; font-size:.95rem}
.row .m{color:var(--ink-3); font-size:.83rem; display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:2px}
.tl{position:relative; padding-left:22px; margin:0}
.tl::before{content:''; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--rule)}
.tl li{list-style:none; position:relative; padding:0 0 15px}
.tl li::before{
  content:''; position:absolute; left:-21px; top:7px; width:9px;height:9px; border-radius:50%;
  background:var(--card); border:2px solid var(--green);
}
.tl .y{font-family:var(--serif); font-weight:700; color:var(--green); font-size:.9rem}
.gal{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:11px}
.gal figure{margin:0; border-radius:var(--r-s); overflow:hidden; border:1px solid var(--rule); background:var(--raise)}
.gal img{aspect-ratio:1; object-fit:cover; width:100%}
.gal figcaption{padding:7px 9px; font-size:.78rem; color:var(--ink-2)}
.story{border-left:3px solid var(--accent); padding:2px 0 2px 15px; margin:0 0 18px}
.story .body{white-space:pre-wrap; font-family:var(--serif); font-size:1.02rem; line-height:1.66}
.story .by{font-size:.82rem; color:var(--ink-3); margin-top:8px}

/* ── browse & search ────────────────────────────────────────────────── */
.pgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:12px}
.pcard{display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; padding:15px 11px; color:var(--ink)}
.pcard:hover{border-color:var(--green); text-decoration:none}
.pcard .av{width:58px;height:58px}
.pcard .nm{font-family:var(--serif); font-weight:600; font-size:.95rem; line-height:1.25}
.filters{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; align-items:center}
.filters select,.filters input{width:auto; min-width:135px; padding:7px 11px; font-size:.88rem}
mark{background:var(--accent-wash); color:var(--accent-ink); border-radius:3px; padding:0 2px}

/* ── misc ───────────────────────────────────────────────────────────── */
.loading{display:grid; place-items:center; gap:12px; padding:70px 0; color:var(--ink-3)}
.spin{width:26px;height:26px;border:2px solid var(--rule); border-top-color:var(--green); border-radius:50%; animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.src{font-size:.76rem; color:var(--ink-3); text-align:center; padding:22px 0 0}
.updatebar{
  position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:80;
  display:flex; align-items:center; gap:12px; padding:9px 10px 9px 16px; border-radius:99px;
  background:var(--card); border:1px solid var(--rule); box-shadow:var(--shadow);
  font-size:.88rem; max-width:calc(100vw - 28px);
}
.updatebar[hidden]{display:none}
footer.site{border-top:1px solid var(--rule); padding:24px 0 40px; color:var(--ink-3); font-size:.84rem}
.lightbox{
  position:fixed; inset:0; z-index:100; background:rgba(10,12,11,.9); display:grid; place-items:center; padding:22px;
}
.lightbox img{max-height:82vh; max-width:100%; border-radius:var(--r-s)}
.lightbox .cap{color:#ddd; text-align:center; font-size:.88rem; margin-top:12px; max-width:60ch}

@media(max-width:720px){
  #navToggle{display:grid}
  nav.main{
    display:none; position:absolute; top:60px; left:0; right:0; flex-direction:column; align-items:stretch;
    background:var(--card); border-bottom:1px solid var(--rule); padding:8px; gap:2px; box-shadow:var(--shadow);
  }
  nav.main.open{display:flex}
  nav.main a{padding:11px 14px; border-radius:var(--r-s)}
  .tnode{width:96px}
  .tnode .av{width:38px;height:38px}
}
@media print{
  header.site,footer.site,.treebar,.noprint{display:none !important}
  body{background:#fff}
  .card{box-shadow:none; border-color:#ccc}
  a{color:inherit}
}
</style>
</head>

<main class="wrap" id="app">

const DB = {};

/* ── CSV (RFC 4180: quotes, embedded commas and newlines) ────────────── */
function parseCSV(text){
  const out=[]; let row=[], field="", q=false, i=0;
  text = text.replace(/^﻿/,"");
  while(i < text.length){
    const c = text[i];
    if(q){
      if(c === '"'){
        if(text[i+1] === '"'){ field+='"'; i+=2; continue; }
        q=false; i++; continue;
      }
      field+=c; i++; continue;
    }
    if(c === '"'){ q=true; i++; continue; }
    if(c === ','){ row.push(field); field=""; i++; continue; }
    if(c === '\r'){ i++; continue; }
    if(c === '\n'){ row.push(field); out.push(row); row=[]; field=""; i++; continue; }
    field+=c; i++;
  }
  if(field !== "" || row.length){ row.push(field); out.push(row); }
  return out;
}
function toObjects(rows){
  if(!rows.length) return [];
  const head = rows[0].map(h => h.trim());
  return rows.slice(1)
    .filter(r => r.some(v => String(v).trim() !== ""))
    .map(r => { const o={}; head.forEach((h,i)=> o[h] = (r[i]==null?"":String(r[i]).trim())); return o; });
}

/* ── loading ────────────────────────────────────────────────────────── */
// The stamp defeats any cache sitting between the browser and Google, on top of
// the no-store below. Family data changes daily; it must never come from a cache.
const gvizURL = tab =>
  `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&headers=1` +
  `&sheet=${encodeURIComponent(tab)}&_=${Date.now()}`;

async function loadFromSheet(){
  const results = await Promise.all(CONFIG.TABS.map(async tab => {
    try{
      const r = await fetch(gvizURL(tab), {cache:"no-store"});
      if(!r.ok) throw new Error(r.status);
      const t = await r.text();
      if(/^\s*</.test(t)) throw new Error("not csv");   // sign-in page or error HTML
      return [tab, toObjects(parseCSV(t))];
    }catch(e){ return [tab, null]; }
  }));
  const map = Object.fromEntries(results);
  if(!map.PEOPLE || !map.PEOPLE.length) throw new Error("PEOPLE tab unreadable");
  CONFIG.TABS.forEach(t => DB[t] = map[t] || []);
  SOURCE = "sheet";
}

async function loadFromScript(){
  const r = await fetch(CONFIG.APPS_SCRIPT_URL + "?action=data", {cache:"no-store"});
  const j = await r.json();
  if(!j || !j.PEOPLE) throw new Error("bad payload");
  CONFIG.TABS.forEach(t => DB[t] = j[t] || []);
  SOURCE = "script";
}

/**
 * Anything not approved is discarded the moment it arrives, so unvetted text
 * never reaches the rendered page. Only the count is kept, for the worklist.
 * (The real guard is on the spreadsheet side: submissions land in an INBOX
 * sheet the website never reads at all.)
 */
let PENDING = 0;
function dropUnapproved(){
  PENDING = 0;
  ["PHOTOS","STORIES"].forEach(t => {
    const keep = [];
    (DB[t] || []).forEach(r => {
      const st = (r.ApprovalStatus || "").trim();
      if(!st || /^approved$/i.test(st)) keep.push(r);
      else if(/^pending$/i.test(st)) PENDING++;
    });
    DB[t] = keep;
  });
}

function loadSeed(){
  CONFIG.TABS.forEach(t => DB[t] = (SEED[t] || []).map(o => ({...o})));
  SOURCE = "sample";
}

async function loadAll(){
  if(CONFIG.SHEET_ID){
    try{ await loadFromSheet(); return; }catch(e){ console.warn("Sheet read failed:", e.message); }
  }
  if(CONFIG.APPS_SCRIPT_URL){
    try{ await loadFromScript(); return; }catch(e){ console.warn("Apps Script read failed:", e.message); }
  }
  loadSeed();
}

/* ── settings ───────────────────────────────────────────────────────── */
const SET = {};
function readSettings(){
  (DB.SETTINGS||[]).forEach(r => { if(r.Key) SET[r.Key.trim()] = (r.Value||"").trim(); });
}
const setting = (k,d="") => (SET[k] !== undefined && SET[k] !== "") ? SET[k] : d;
const isYes = v => /^(yes|y|true|1)$/i.test(String(v||"").trim());

/* ── index ──────────────────────────────────────────────────────────── */
/* This is a blood-descent tree. A person is linked to the family by ParentID —
   one ungendered column. Parent2ID exists only for the rare case where both
   parents are on record, such as the originating couple. FatherID and MotherID
   are still read so a sheet that has not been renamed keeps working. */
const PARENT_FIELDS = ["ParentID","Parent2ID","FatherID","MotherID"];

function buildIndex(){
  IX.byId={}; IX.kids={}; IX.allKids={}; IX.sub={}; IX.marriedTo={};
  (DB.PEOPLE||[]).forEach(p => { if(p.PersonID) IX.byId[p.PersonID.trim()] = p; });

  Object.values(IX.byId).forEach(p => {
    const me = p.PersonID.trim();
    // kids    — descent, so blood parents only: this is what the tree walks.
    // allKids — the nuclear family, so a mother who married in counts too.
    parentsOf(p).forEach(par => (IX.kids[par] = IX.kids[par] || []).push(me));
    allParents(p).forEach(par => (IX.allKids[par] = IX.allKids[par] || []).push(me));
  });
  // Adoption and guardianship also make someone a parent.
  (DB.RELATIONSHIPS||[]).forEach(r => {
    const t=(r.Type||"").toLowerCase(), a=(r.Person1ID||"").trim(), b=(r.Person2ID||"").trim();
    if(!a || !b) return;
    // Someone who married in holds no place in the line, however the
    // relationship is described. Without this, a guardian or step-parent row
    // would put a spouse back into the tree by the side door.
    if(marriedIn(IX.byId[a]) || marriedIn(IX.byId[b])) return;
    if(/adoptive parent|guardian|step-parent/.test(t)){
      if(!(IX.kids[a]||[]).includes(b)) (IX.kids[a]=IX.kids[a]||[]).push(b);
    }
  });
  Object.keys(IX.kids).forEach(k => IX.kids[k] = sortSibs(dedupe(IX.kids[k])));
  Object.keys(IX.allKids).forEach(k => IX.allKids[k] = sortSibs(dedupe(IX.allKids[k])));

  // Who has been named as somebody's spouse, looked up the other way round, so
  // that a marriage need only be written down on one of the two rows.
  Object.values(IX.byId).forEach(p => {
    const me = p.PersonID.trim();
    splitIds(p.SpouseID).forEach(id => {
      if(!IX.byId[id] || id === me) return;
      (IX.marriedTo[id] = IX.marriedTo[id] || []).push(me);
    });
  });

  ["PLACES","OCCUPATIONS","EDUCATION","EVENTS","PHOTOS","STORIES"].forEach(tab => {
    IX.sub[tab] = {};
    (DB[tab]||[]).forEach(r => {
      const id=(r.PersonID||"").trim(); if(!id) return;
      (IX.sub[tab][id] = IX.sub[tab][id] || []).push(r);
    });
  });
}
const dedupe = a => [...new Set(a)];
function sortSibs(ids){
  return ids.slice().sort((x,y)=>{
    const a=IX.byId[x], b=IX.byId[y];
    const ao=parseFloat(a.SortOrder), bo=parseFloat(b.SortOrder);
    if(!isNaN(ao) && !isNaN(bo) && ao!==bo) return ao-bo;
    if(!isNaN(ao) && isNaN(bo)) return -1;
    if(isNaN(ao) && !isNaN(bo)) return 1;
    const ay=year(a.BirthDate), by=year(b.BirthDate);
    if(ay && by && ay!==by) return ay-by;
    return name(a).localeCompare(name(b));
  });
}

/* ── people helpers ─────────────────────────────────────────────────── */
const P  = id => IX.byId[(id||"").trim()] || null;
const name = p => (p && (p.DisplayName || p.FullName || p.PersonID)) || "Unknown";
const kids = id => IX.kids[(id||"").trim()] || [];

/* Someone who married into the family is a full member of it — their own page,
   their own photographs, their own stories — but they hold no place in the line
   of descent. They are never an ancestor, never a descendant, never counted in
   anybody's lineage, and never drawn in the tree. What they do have is a nuclear
   family: the husband or wife they married, and the children of that marriage.

   They are marked by Bloodline = No, and by convention carry an S-prefixed
   Person ID (S001, S002 …) so they can be told apart at a glance. Either is
   enough — a row with an S id that nobody remembered to mark stays out of the
   line, rather than silently becoming an ancestor. */
/* Person IDs never contain a comma, so either separator will do for them.
   Names frequently do — "Mary Ekpo, née Bassey" is one woman — so names are
   separated by semicolons only. */
const splitIds   = v => String(v||"").split(/[;,]/).map(x=>x.trim()).filter(Boolean);
const splitNames = v => String(v||"").split(/;/).map(x=>x.trim()).filter(Boolean);
const marriedIn = p => !!p && (/^no$/i.test(String(p.Bloodline||"").trim()) ||
                               /^S\d/i.test(String(p.PersonID||"").trim()));

/* "Nnyen" and "Nnyen Asim" are the same woman written down twice — once by name
   in Spouse, once by record in SpouseID. Treat a bare name as already covered
   when every word of it appears in a spouse who is on the list already. */
const words = s => String(s||"").toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(Boolean);
function nameCovered(nm, listed){
  const w = words(nm);
  if(!w.length) return false;
  return listed.some(x => { const set = new Set(words(x.name)); return w.every(t => set.has(t)); });
}

/**
 * [{id, name}] — id is present only when the spouse has a record of their own.
 *
 * A marriage is read from both rows, not just this one. Recording it once, on
 * either side, is enough: put SpouseID on the husband's row and the wife's page
 * shows him too. Writing it on both rows is harmless — it is not counted twice.
 */
function spousesOf(p){
  if(!p) return [];
  const me = (p.PersonID||"").trim();
  const out = [], seenId = new Set(), seenName = new Set();
  const add = (id, nm) => {
    if(id){ if(seenId.has(id)) return; seenId.add(id); }
    else if(seenName.has(nm)) return; else seenName.add(nm);
    out.push({id: id || null, name: nm});
  };
  splitIds(p.SpouseID).forEach(id => { const q=P(id); if(q && id!==me) add(id, name(q)); });
  (IX.marriedTo[me] || []).forEach(id => { const q=P(id); if(q) add(id, name(q)); });
  splitNames(p.Spouse).forEach(nm => { if(!nameCovered(nm, out)) add(null, nm); });
  return out;
}
/** What to call this person's spouse, given their own gender. */
function spouseLabel(p, n){
  const g=(p?.Gender||"U").toUpperCase();
  if(g==="M") return n>1 ? "Wives" : "Wife";
  if(g==="F") return n>1 ? "Husbands" : "Husband";
  return n>1 ? "Spouses" : "Spouse";
}
/* Two different questions, and conflating them is what makes spouses go wrong.
   parentsOf  — who this person DESCENDS from. Blood only. Everything to do with
                the tree, generations, branches, ancestry and cousinhood uses it.
   allParents — who RAISED this person: the same list, plus a mother or father
                who married in. Used only for what a page shows, never for descent. */
const allParents = p => p
  ? dedupe(PARENT_FIELDS.map(f => (p[f]||"").trim()))
      .filter(x => x && IX.byId[x] && x !== p.PersonID)
  : [];
const parentsOf = p => allParents(p).filter(x => !marriedIn(IX.byId[x]));

/** The children of this marriage — those who name this person as a parent. */
const nuclearKids = id => IX.allKids[(id||"").trim()] || [];
const isPrivate = p => /^private$/i.test(p?.Privacy||"");
const isLimited = p => isPrivate(p) || (isYes(setting("hide_living_details","Yes")) && isYes(p?.Living));
function year(s){ const m = String(s||"").match(/\b(\d{4})\b/); return m ? +m[1] : null; }
function rowsFor(tab,id){ return (IX.sub[tab] && IX.sub[tab][id]) || []; }
function approved(rows){ return rows.filter(r => !r.ApprovalStatus || /^approved$/i.test(r.ApprovalStatus)); }

/** Anyone who shares a parent — a mother who married in makes siblings too. */
function siblings(id){
  const p = P(id); if(!p) return [];
  const mine = new Set(allParents(p));
  if(!mine.size) return [];
  return sortSibs(Object.values(IX.byId)
    .filter(q => q.PersonID !== id && !marriedIn(q))
    .filter(q => allParents(q).some(x => mine.has(x)))
    .map(q => q.PersonID.trim()));
}
function lifespan(p){
  if(!p) return "";
  if(isLimited(p)) return "";
  const b=year(p.BirthDate), d=year(p.DeathDate);
  if(b && d) return `${b}–${d}`;
  if(b) return isYes(p.Living) ? `b. ${b}` : `b. ${b}`;
  if(d) return `d. ${d}`;
  return "";
}
function ancestorMap(id){                       // id -> generations upward
  const out=new Map(); const q=[[id,0]]; const seen=new Set([id]);
  while(q.length){
    const [cur,d]=q.shift();
    if(d) out.set(cur,d);
    parentsOf(P(cur)).forEach(par => { if(!seen.has(par)){ seen.add(par); q.push([par,d+1]); } });
  }
  return out;
}
function descendantSet(id){
  const out=new Set(); const q=[id];
  while(q.length){
    const cur=q.shift();
    kids(cur).forEach(k => { if(!out.has(k)){ out.add(k); q.push(k); } });
  }
  return out;
}
function lineage(id){                           // root-most ancestor down to id
  const path=[id]; let cur=id; const guard=new Set([id]);
  while(true){
    const ps=parentsOf(P(cur));
    if(!ps.length) break;
    const next = ps.find(x=>!guard.has(x)); if(!next) break;
    guard.add(next); path.unshift(next); cur=next;
  }
  return path;
}
const ORD=["","first","second","third","fourth","fifth","sixth","seventh","eighth","ninth","tenth"];
const ordinal = n => ORD[n] || `${n}th`;
const greats = n => n<=0 ? "" : n<=3 ? "great-".repeat(n) : `${n}×great-`;

function relationshipTo(fromId, toId){
  if(!fromId || !toId || fromId===toId) return "";
  // A mother or father who married in is not in the line, so no amount of
  // walking the ancestry will find them — but they are still the parent, and
  // saying "not connected" of somebody's own mother would be absurd.
  if(allParents(P(toId)).indexOf(fromId) >= 0) return "parent";
  if(allParents(P(fromId)).indexOf(toId) >= 0) return "child";
  const A = ancestorMap(fromId), B = ancestorMap(toId);
  if(B.has(fromId)){                                  // from is an ancestor of to
    const d=B.get(fromId);
    if(d===1) return "parent";
    if(d===2) return "grandparent";
    return greats(d-2)+"grandparent";
  }
  if(A.has(toId)){                                    // to is an ancestor of from
    const d=A.get(toId);
    if(d===1) return "child";
    if(d===2) return "grandchild";
    return greats(d-2)+"grandchild";
  }
  let best=null;
  A.forEach((da,anc)=>{ if(B.has(anc)){ const db=B.get(anc); const s=da+db;
    if(!best || s<best.s || (s===best.s && Math.min(da,db)<Math.min(best.da,best.db))) best={anc,da,db,s};
  }});
  if(!best) return "";                    // no blood connection on record
  const {da,db}=best;
  // da = generations from `from` up to the shared ancestor; db = the same for `to`.
  if(da===1 && db===1) return "sibling";
  if(da===1) return greats(db-2)+"aunt or uncle";       // from's parent is to's (great-)grandparent
  if(db===1) return greats(da-2)+"nephew or niece";     // to's parent is from's (great-)grandparent
  const n=Math.min(da,db)-1, r=Math.abs(da-db);
  return `${ordinal(n)} cousin${r ? ` ${r===1?"once":r===2?"twice":r+" times"} removed` : ""}`;
}

/* ── silhouettes (inline SVG so they follow the theme) ───────────────── */
function silhouette(g){

    ? `<path class="sil-fg" d="M50 14c-12 0-19 8-19 19 0 5 1 9 3 12-3-1-5-4-5-9 0-15 8-25 21-25s21 10 21 25c0 5-2 8-5 9 2-3 3-7 3-12 0-11-7-19-19-19z"/>` : "";

    ? "M12 100c0-19 17-30 38-30s38 11 38 30z"

/**
 * Group people into branches. Explicit Branch labels win; if the column has not
 * been filled in, the branches are worked out from the tree itself so the home
 * page is useful either way.
 */
function branchGroups(people){
  const byLabel = {};
  people.forEach(p => { const b=(p.Branch||"").trim(); if(b) (byLabel[b]=byLabel[b]||[]).push(p); });
  const labels = Object.keys(byLabel);
  const earliest = list => list.slice().sort((x,y)=>(+x.Generation||99)-(+y.Generation||99))[0];

  if(labels.length >= 2){
    return {derived:false, groups: labels
      .map(b => ({title:b, list:byLabel[b], head:earliest(byLabel[b])}))
      .sort((a,b)=>b.list.length-a.list.length)};
  }

  const root = P(setting("root_person_id","")) ? setting("root_person_id") : rootMost();
  const groups = kids(root).map(id => {
    const head = P(id);
    const list = [head, ...[...descendantSet(id)].map(P).filter(Boolean)];
    return {title:`${name(head)}’s line`, list, head};
  }).filter(g => g.head).sort((a,b)=>b.list.length-a.list.length);
  return {derived:true, groups};
}

/* Where the data came from is a maintenance detail, not something visitors
   need to read. It goes to the browser console and the unlisted admin page. */
function sourceNote(){ return ""; }

/* ── tree ───────────────────────────────────────────────────────────── */
const TREE = {root:null, mode:"chart", modeSet:false, zoom:1, collapsed:new Set(), depth:0, appliedKey:null};

/** Collapse every node deep enough that only `depth` generations remain visible. */
function collapseBeyond(depth){
  const set = new Set();
  (function walk(id, d, seen){
    if(seen.has(id)) return;
    seen = new Set(seen); seen.add(id);
    const ch = kids(id).filter(k => !seen.has(k));
    if(!ch.length) return;
    if(d >= depth-1){ set.add(id); return; }   // hide this person's children
    ch.forEach(k => walk(k, d+1, seen));
  })(TREE.root, 0, new Set());
  return set;
}

/** How many generations hang below a person. */
function treeDepth(id){
  var max = 1;
  (function walk(x, d, seen){
    if(seen.has(x)) return;
    seen = new Set(seen); seen.add(x);
    max = Math.max(max, d);
    kids(x).filter(k=>!seen.has(k)).forEach(k => walk(k, d+1, seen));
  })(id, 1, new Set());
  return max;
}

function viewTree(params){
  const people = Object.values(IX.byId);
  if(!people.length){ app().innerHTML = `<p class="muted">No people recorded yet.</p>`; return; }
  const wanted = params.get("root") || TREE.root || setting("root_person_id","");
  // The tree is a line of descent, so it cannot begin with someone who married
  // into it — not from a saved link, and not from the selector below.
  TREE.root = (P(wanted) && !marriedIn(P(wanted))) ? wanted : rootMost();
  const inLine = people.filter(p => !marriedIn(p));

  // A big tree squeezed to fit becomes unreadable, so show the top few
  // generations by default and let people open the rest.
  const size = descendantSet(TREE.root).size + 1;
  const deepest = treeDepth(TREE.root);
  if(!TREE.depth) TREE.depth = size > 25 ? 3 : 99;
  if(!TREE.modeSet && innerWidth < 720) TREE.mode = "outline";

  const key = TREE.root + "|" + TREE.depth;
  if(TREE.appliedKey !== key){ TREE.collapsed = collapseBeyond(TREE.depth); TREE.appliedKey = key; }

  app().innerHTML = `
    <div class="treebar noprint">
      <label class="small muted" for="rootSel">Start from</label>
      <select id="rootSel">${inLine.slice().sort((a,b)=>(+a.Generation||99)-(+b.Generation||99) || name(a).localeCompare(name(b)))
        .map(p=>`<option value="${esc(p.PersonID)}" ${p.PersonID===TREE.root?"selected":""}>${
          esc(isPrivate(p) ? "Private" : name(p))}${p.Generation?` · gen ${esc(p.Generation)}`:""}</option>`).join("")}</select>
      <button class="btn sm" id="upBtn" ${parentsOf(P(TREE.root)).length?"":"disabled"}>↑ Up a generation</button>
      ${deepest > 3 ? `<label class="small muted" for="depthSel">Show</label>
        <select id="depthSel">${[3,4,5,6,99].filter(d=>d<=deepest||d===99).map(d=>
          `<option value="${d}" ${TREE.depth===d?"selected":""}>${d===99?"every generation":d+" generations"}</option>`).join("")}</select>` : ""}
      <span style="flex:1"></span>
      <button class="btn sm" id="modeBtn">${TREE.mode==="chart"?"Outline view":"Chart view"}</button>
      <button class="btn sm" id="expandBtn">Expand all</button>
      <button class="btn sm" id="collapseBtn">Collapse</button>
      ${TREE.mode==="chart"?`<button class="btn sm" id="zoomOut" title="Zoom out">−</button>
        <button class="btn sm" id="fitBtn" title="Fit the whole tree in view"><span id="zoomLbl">fit</span></button>
        <button class="btn sm" id="zoomIn" title="Zoom in">+</button>`:""}
    </div>
    <div id="treeHost"></div>
    ${sourceNote()}`;

  drawTree(true);

  document.getElementById("rootSel").onchange = e => { TREE.root=e.target.value; TREE.collapsed.clear(); location.hash = `#/tree?root=${encodeURIComponent(TREE.root)}`; };
  document.getElementById("upBtn").onclick = () => {
    const ps=parentsOf(P(TREE.root)); if(ps.length) location.hash = `#/tree?root=${encodeURIComponent(ps[0])}`;
  };
  const ds = document.getElementById("depthSel");
  if(ds) ds.onchange = e => { TREE.depth = +e.target.value; viewTree(params); };
  document.getElementById("modeBtn").onclick = () => {
    TREE.mode = TREE.mode==="chart"?"outline":"chart"; TREE.modeSet = true; viewTree(params);
  };
  document.getElementById("expandBtn").onclick = () => {
    TREE.depth = 99; TREE.appliedKey = TREE.root + "|99"; TREE.collapsed.clear(); viewTree(params);
  };
  document.getElementById("collapseBtn").onclick = () => {
    TREE.collapsed = new Set([...descendantSet(TREE.root), TREE.root].filter(id=>kids(id).length));
    drawTree(true);
  };
  const zi=document.getElementById("zoomIn"), zo=document.getElementById("zoomOut"), fb=document.getElementById("fitBtn");
  if(zi) zi.onclick = () => { TREE.zoom = Math.min(1.8, TREE.zoom+.15); applyZoom(); };
  if(zo) zo.onclick = () => { TREE.zoom = Math.max(.25, TREE.zoom-.15); applyZoom(); };
  if(fb) fb.onclick = fitTree;
}

/* The chart is scaled with a transform, so its layout box has to be widened by
   the same factor or the scrolling area comes out wrong. */
function applyZoom(){
  const vp=document.querySelector(".viewport"), sc=document.querySelector(".chartscale");
  if(!vp || !sc) return;
  const z=TREE.zoom;
  sc.style.width = (100/z)+"%";
  sc.style.transform = `scale(${z})`;
  // getBoundingClientRect is post-transform, so this is the height actually drawn.
  vp.style.height = Math.min(innerHeight*0.82, sc.firstElementChild.getBoundingClientRect().height + 54) + "px";
  const lbl=document.getElementById("zoomLbl");
  if(lbl) lbl.textContent = Math.round(z*100)+"%";
}

/** Scale the chart so the whole family fits across the screen. */
function fitTree(){
  const vp=document.querySelector(".viewport"), sc=document.querySelector(".chartscale");
  if(!vp || !sc) return;
  sc.style.transition="none";                       // snap, don't animate, on first draw
  sc.style.width="100%"; sc.style.transform="none";
  const need = sc.firstElementChild.offsetWidth;
  const have = vp.clientWidth - 40;
  // Never shrink below the point where names stop being readable — scrolling a
  // legible tree beats squinting at a whole one.
  TREE.zoom = Math.max(.45, Math.min(1, have/need));
  applyZoom();
  void sc.offsetWidth;                              // flush layout before re-arming the transition
  sc.style.transition="";
}
function rootMost(){
  const people=Object.values(IX.byId);
  const roots = people.filter(p=>!parentsOf(p).length && !marriedIn(p));
  const pick = roots.sort((a,b)=>descendantSet(b.PersonID).size-descendantSet(a.PersonID).size)[0] || people[0];
  return pick.PersonID;
}
function drawTree(fit){
  const host=document.getElementById("treeHost"); if(!host) return;
  DRAWN = new Set();
  if(TREE.mode==="outline"){
    host.innerHTML = `<div class="card pad"><ul class="outline">${outlineNode(TREE.root,new Set())}</ul></div>`;
  }else{
    host.innerHTML = `<div class="viewport"><div class="chartscale"><div class="chart"><ul>${chartNode(TREE.root,new Set())}</ul></div></div></div>`;
    fit ? fitTree() : applyZoom();
  }
  host.querySelectorAll("[data-toggle]").forEach(b => b.onclick = ev => {
    ev.preventDefault(); ev.stopPropagation();
    const id=b.dataset.toggle;
    TREE.collapsed.has(id) ? TREE.collapsed.delete(id) : TREE.collapsed.add(id);
    drawTree(false);
  });
}
function nodeCard(id, focus){
  const p=P(id); if(!p) return "";
  const ls=lifespan(p);
  return `<a class="tnode ${focus?"is-focus":""}" href="#/person/${encodeURIComponent(id)}" title="${esc(name(p))}">
    ${p.Generation?`<span class="gen">${esc(p.Generation)}</span>`:""}
    ${avatar(p)}
    <span class="nm">${esc(isPrivate(p)?"Private":name(p))}</span>
    ${ls?`<span class="yr">${esc(ls)}</span>`:""}
  </a>`;
}
let DRAWN = null;   // reset each render, so nobody appears twice in one chart

/**
 * Anyone who is a parent of the same children as this person — which in this
 * tree means the originating couple. They are drawn side by side because both
 * are ancestors of everyone below, not because they were married.
 */
function coParents(id){
  const mine = new Set(kids(id));
  if(!mine.size) return [];
  return Object.values(IX.byId)
    .filter(q => q.PersonID !== id && !DRAWN.has(q.PersonID) && !marriedIn(q))
    .filter(q => kids(q.PersonID).some(k => mine.has(k)))
    .map(q => q.PersonID);
}

function chartNode(id, seen){
  if(seen.has(id) || DRAWN.has(id)) return "";
  seen = new Set(seen); seen.add(id); DRAWN.add(id);

  const co = coParents(id);
  co.forEach(c => DRAWN.add(c));
  const all = new Set(kids(id));
  co.forEach(c => kids(c).forEach(k => all.add(k)));
  const ch = [...all].filter(k => !seen.has(k) && !DRAWN.has(k));

  const collapsed = TREE.collapsed.has(id);
  const card = `<div class="couple">${nodeCard(id, id===TREE.root)}${
    co.map(c => `<div class="joint"></div>${nodeCard(c,false)}`).join("")}${
    ch.length ? `<button class="expander" data-toggle="${esc(id)}" title="${collapsed?"Show":"Hide"} ${ch.length} ${ch.length===1?"child":"children"}">${collapsed?`+${ch.length}`:"−"}</button>` : ""
  }</div>`;
  const sub = (ch.length && !collapsed) ? `<ul>${ch.map(k=>chartNode(k,seen)).join("")}</ul>` : "";
  return `<li>${card}${sub}</li>`;
}
function outlineNode(id, seen){
  if(seen.has(id) || DRAWN.has(id)) return "";
  seen=new Set(seen); seen.add(id); DRAWN.add(id);
  const p=P(id); if(!p) return "";
  const co = coParents(id);
  co.forEach(c => DRAWN.add(c));
  const all = new Set(kids(id));
  co.forEach(c => kids(c).forEach(k => all.add(k)));
  const ch = [...all].filter(k => !seen.has(k) && !DRAWN.has(k));
  const collapsed=TREE.collapsed.has(id);
  return `<li>
    <div style="display:flex; align-items:center; gap:6px">
      ${ch.length?`<button class="otog" data-toggle="${esc(id)}">${collapsed?"+":"−"}</button>`:`<span style="width:20px"></span>`}
      <a class="orow" href="#/person/${encodeURIComponent(id)}" style="flex:1">
        ${avatar(p)}
        <span><span class="nm">${esc(isPrivate(p)?"Private":name(p))}${
          co.map(c=>` &amp; ${esc(name(P(c)))}`).join("")}</span>
        <span class="small muted">${esc([lifespan(p), ch.length?`${ch.length} ${ch.length===1?"child":"children"}`:""].filter(Boolean).join(" · "))}</span></span>
      </a>
    </div>
    ${(ch.length && !collapsed)?`<ul>${ch.map(k=>outlineNode(k,seen)).join("")}</ul>`:""}
  </li>`;
}

/* ── person ─────────────────────────────────────────────────────────── */
let ME = null;

function viewPerson(id){
  const p=P(id);
  if(!p){ app().innerHTML=`<div class="card pad"><h1>Not found</h1><p class="muted">No person with the ID “${esc(id)}”.</p><p><a class="btn" href="#/browse">Browse everyone</a></p></div>`; return; }

  if(isPrivate(p)){
    app().innerHTML = `<div class="card pad"><h1>Private record</h1>
      <p class="muted">This person's details are not published.
        ${marriedIn(p) ? "They married into the family." : "They still hold their place in the tree."}</p>
      ${marriedIn(p) ? "" : `<p><a class="btn" href="#/tree?root=${encodeURIComponent(id)}">See their place in the tree</a></p>`}</div>`;
    return;
  }

  const lim = isLimited(p);
  const wed = marriedIn(p);
  // Someone who married in has a nuclear family and nothing above it: no
  // lineage to walk up, no siblings in this family, and only the children of
  // the marriage. Everyone else sees their parents — including a mother or
  // father who married in, who belongs on the page even though they are not
  // part of the descent.
  const line = wed ? [id] : lineage(id);
  const par = wed ? [] : allParents(p);
  const sib = wed ? [] : siblings(id);
  const ch  = wed ? nuclearKids(id) : kids(id);
  const sps = spousesOf(p);
  const desc = wed ? new Set() : descendantSet(id);

  const crumb = line.length>1
    ? `<div class="crumb">${line.map((x,i)=>`${i?'<span class="sep">›</span>':""}<a href="#/person/${encodeURIComponent(x)}">${esc(name(P(x)))}</a>`).join("")}</div>` : "";

  /* left column */
  let left = "";

  const bio = (p.ShortBio||"").trim();
  if(bio && !lim) left += section("About", `<p style="font-family:var(--serif); font-size:1.04rem; white-space:pre-wrap">${esc(bio)}</p>`);

  if(!lim){
    const life = [
      ["Born", [p.BirthDate, p.BirthPlace].filter(Boolean).join(" · ")],
      ["Died", [p.DeathDate, p.DeathPlace].filter(Boolean).join(" · ")],
      ["Buried", p.BurialPlace],
    ].filter(r=>r[1]);
    if(life.length) left += section("Life", `<dl class="dl">${life.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`);
  }

  const occ = lim ? [] : rowsFor("OCCUPATIONS",id).slice().sort((a,b)=>(+a.FromYear||9999)-(+b.FromYear||9999));
  if(occ.length) left += section("Profession & career", `<div class="rows">${occ.map(o=>`
    <div class="row"><div class="t">${esc(o.Occupation||"—")}${o.Specialisation?` <span class="muted small">· ${esc(o.Specialisation)}</span>`:""}</div>
    <div class="m">${[span(o.FromYear,o.ToYear), o.Employer, o.Place].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("")}</div>
    ${o.Achievements?`<div class="small" style="margin-top:5px">${esc(o.Achievements)}</div>`:""}</div>`).join("")}</div>`);

  const edu = lim ? [] : rowsFor("EDUCATION",id).slice().sort((a,b)=>(+a.FromYear||9999)-(+b.FromYear||9999));
  if(edu.length) left += section("Education & training", `<div class="rows">${edu.map(e=>`
    <div class="row"><div class="t">${esc(e.Institution||e.Level||"—")}</div>
    <div class="m">${[e.Level, e.Qualification, span(e.FromYear,e.ToYear), e.Place].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>`).join("")}</div>`);

  const pl = lim ? [] : rowsFor("PLACES",id);
  if(pl.length) left += section("Places in this life", `<div class="rows">${pl.slice().sort((a,b)=>(+a.FromYear||9999)-(+b.FromYear||9999)).map(l=>`
    <div class="row"><div class="t">${esc([l.Place,l.Country].filter(Boolean).join(", "))}</div>
    <div class="m">${[l.PlaceType, span(l.FromYear,l.ToYear)].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("")}</div>
    ${l.Notes?`<div class="small" style="margin-top:5px">${esc(l.Notes)}</div>`:""}</div>`).join("")}</div>`);

  const tl = lim ? [] : timeline(p);
  if(tl.length) left += section("Life timeline", `<ul class="tl">${tl.map(e=>`
    <li><div class="y">${esc(e.label)}</div><div>${esc(e.title)}${e.place?` <span class="muted small">· ${esc(e.place)}</span>`:""}</div>
    ${e.desc?`<div class="small muted" style="margin-top:3px">${esc(e.desc)}</div>`:""}</li>`).join("")}</ul>`);

  const st = lim ? [] : approved(rowsFor("STORIES",id));
  if(st.length) left += section("Stories & memories", st.map(s=>`
    <article class="story"><h3>${esc(s.Title||"Untitled")}</h3>
    <div class="body">${esc(s.Story||"")}</div>
    <div class="by">${[s.ToldBy?`Told by ${s.ToldBy}`:"", s.RecordedDate?`Recorded ${s.RecordedDate}`:""].filter(Boolean).join(" · ")}</div></article>`).join(""));

  const ph = approved(rowsFor("PHOTOS",id)).filter(r=>(r.DriveFileID||"").trim());
  if(ph.length) left += section("Photographs", `<div class="gal">${ph.map(f=>`
    <figure><img src="${esc(driveURL(f.DriveFileID,700))}" alt="${esc(f.Caption||name(p))}" loading="lazy"
      data-full="${esc(driveURL(f.DriveFileID,1600))}" data-cap="${esc(f.Caption||"")}" style="cursor:zoom-in">
    ${f.Caption?`<figcaption>${esc(f.Caption)}${f.PhotoDate?` <span class="muted">· ${esc(f.PhotoDate)}</span>`:""}</figcaption>`:""}</figure>`).join("")}</div>`);

  if(!left) left = `<section class="card pad"><p class="muted">Nothing has been recorded about this person's life yet — only their place in the family.
    ${lim ? "Details of living relatives are kept off this site."
          : (canContribute() ? `If you remember anything about them, please <a href="#/contribute">add it to the archive</a>.` : "")}</p></section>`;

  /* right column */
  const famBlock = (label, html) =>
    `<div style="margin-bottom:14px"><div class="small muted" style="margin-bottom:7px">${label}</div>
     <div class="plist">${html}</div></div>`;

  // A spouse with a record links through to it; one recorded only by name is
  // shown as a plain chip, because there is nothing to link to.
  const spouseHtml = sps.map(sp => sp.id
    ? personChip(sp.id)
    : `<span class="pchip" style="cursor:default">${avatar(null)}<span>${esc(sp.name)}</span></span>`).join("");

  const fam = [
    par.length ? famBlock("Parents", par.map(x=>personChip(x)).join("")) : "",
    sib.length ? famBlock("Siblings", sib.map(x=>personChip(x)).join("")) : "",
    sps.length ? famBlock(spouseLabel(p, sps.length), spouseHtml) : "",
    ch.length  ? famBlock(wed && sps.length===1 ? `Children with ${esc(sps[0].name)}` : "Children",
                          ch.map(x=>personChip(x)).join("")) : "",
  ].join("");

  const relSel = `<select id="meSel" style="margin-top:8px">
      <option value="">— choose a person —</option>
      ${Object.values(IX.byId).filter(q=>q.PersonID!==id && !isPrivate(q))
        .map(q=>`<option value="${esc(q.PersonID)}" ${ME===q.PersonID?"selected":""}>${esc(name(q))}</option>`).join("")}
    </select>`;
  const relOut = ME && P(ME) ? (() => {
      const r = relationshipTo(ME, id);
      return `<p style="margin:10px 0 0"><b>${esc(name(P(ME)))}</b> is ${r?`the <b>${esc(r)}</b> of`:"not connected by blood to"} <b>${esc(name(p))}</b>.</p>`;
    })() : "";

  // A spouse's page stops at the edge of the nuclear family. Everything beyond
  // it — the branch, the generation, the descendant count, the walk up the
  // tree, the cousin calculator — belongs to the line of descent, which is not
  // theirs. What replaces it says so plainly, and points at the family they
  // joined rather than leaving the column empty.
  const partner = sps.filter(x=>x.id)[0] || null;
  const right = `
    ${section("Family", fam || `<p class="muted small">No relatives recorded yet.</p>`)}
    ${wed ? section("In the family", `
      <p class="small muted" style="margin:0 0 12px">${esc(name(p))} married into the family.
      ${sps.length ? `Their place here is beside <b>${esc(sps.map(x=>x.name).join(" and "))}</b>` : "Their place here is by marriage"}${
        ch.length ? `, with ${ch.length} ${ch.length===1?"child":"children"} of that marriage` : ""}.
      They hold no place in the line of descent, so they have no branch, no generation and no ancestors here.</p>
      ${partner ? `<p style="margin:0"><a class="btn sm" href="#/tree?root=${encodeURIComponent(partner.id)}">See ${esc(partner.name)}'s place in the tree</a></p>` : ""}`)
    : section("In the tree", `<dl class="dl">
      ${p.Branch?`<dt>Branch</dt><dd>${esc(p.Branch)}</dd>`:""}
      ${p.Generation?`<dt>Generation</dt><dd>${esc(p.Generation)}</dd>`:""}
      <dt>Descendants</dt><dd>${desc.size}</dd>
    </dl>
    <p style="margin-top:14px"><a class="btn sm" href="#/tree?root=${encodeURIComponent(id)}">See their descendants</a></p>`)}
    ${canContribute() ? section("Missing someone?",
      wed
        ? `<p class="small muted" style="margin:0 0 12px">If ${esc(name(p))} had a child who is not here, please add them.
           Photographs and stories about ${esc(name(p))} are welcome too.</p>
           <a class="btn sm primary" href="#/contribute?about=${encodeURIComponent(partner ? partner.id : id)}">Add to this family</a>`
        : `<p class="small muted" style="margin:0 0 12px">If you know of a relative who belongs beside ${esc(name(p))} and is
           not here — a child, a brother or sister, a husband or wife — please add them.</p>
           <a class="btn sm primary" href="#/contribute?about=${encodeURIComponent(id)}">Add someone to this family</a>`) : ""}
    ${wed ? "" : section("How am I related?", `<p class="small muted">Pick anyone to see how they connect to ${esc(name(p))}.</p>${relSel}${relOut}`)}
    ${(p.OtherNames||p.Nickname||p.FullName) ? section("Names", `<dl class="dl">
      ${p.FullName?`<dt>Full name</dt><dd>${esc(p.FullName)}</dd>`:""}
      ${p.Nickname?`<dt>Known as</dt><dd>${esc(p.Nickname)}</dd>`:""}
      ${p.OtherNames?`<dt>Other names</dt><dd>${esc(p.OtherNames)}</dd>`:""}
    </dl>`) : ""}`;

  app().innerHTML = `
    ${crumb}
    <div class="card pad phead" style="margin-bottom:16px">
      ${avatar(p)}
      <div class="who">
        <h1>${esc(name(p))}</h1>
        <p class="muted" style="margin:0">${esc([lifespan(p), p.Branch].filter(Boolean).join(" · ")) || "&nbsp;"}</p>
        <div class="metaline">
          ${/^(confirmed|reported) by family$/i.test((p.Status||"").trim())
              ? `<span class="chip ${statusClass(p.Status)}">${esc(p.Status.trim())}</span>` : ""}
          ${p.Generation?`<span class="chip">Generation ${esc(p.Generation)}</span>`:""}
          ${marriedIn(p)?`<span class="chip">Married into the family</span>`:""}
          ${lim?`<span class="chip">Details withheld — living</span>`:""}
        </div>
      </div>
    </div>
    <div class="cols"><div>${left}</div><div>${right}</div></div>`;

  const sel=document.getElementById("meSel");
  if(sel) sel.onchange = e => { ME = e.target.value || null; viewPerson(id); };
  app().querySelectorAll("[data-full]").forEach(img => img.onclick = () => lightbox(img.dataset.full, img.dataset.cap));
}

function timeline(p){
  const id=p.PersonID, ev=[];
  const push=(y,label,title,place,desc)=>{ if(title) ev.push({y:y||9999, label:label||String(y||""), title, place:place||"", desc:desc||""}); };
  if(p.BirthDate||p.BirthPlace) push(year(p.BirthDate), p.BirthDate||"", "Born", p.BirthPlace);
  rowsFor("EDUCATION",id).forEach(e=>push(+e.FromYear, span(e.FromYear,e.ToYear)||e.FromYear, [e.Level,e.Institution].filter(Boolean).join(" — ")||"Studied", e.Place, e.Qualification));
  rowsFor("OCCUPATIONS",id).forEach(o=>push(+o.FromYear, span(o.FromYear,o.ToYear)||o.FromYear, o.Occupation||"Worked", o.Place||o.Employer, o.Achievements));
  rowsFor("PLACES",id).filter(l=>l.FromYear && !/^born in$/i.test(l.PlaceType||"")).forEach(l=>push(+l.FromYear, span(l.FromYear,l.ToYear)||l.FromYear, `${l.PlaceType||"Lived in"} ${[l.Place,l.Country].filter(Boolean).join(", ")}`.trim(), "", l.Notes));
  rowsFor("EVENTS",id).forEach(e=>push(+e.Year, e.DateText||e.Year, e.Title||e.EventType||"Event", e.Place, e.Description));
  kids(id).forEach(k=>{ const c=P(k); const y=year(c.BirthDate); if(y && !isLimited(c)) push(y, String(y), `${name(c)} born`, "", ""); });
  if(p.DeathDate||p.DeathPlace) push(year(p.DeathDate), p.DeathDate||"", "Died", p.DeathPlace);
  return ev.sort((a,b)=>a.y-b.y);
}

function lightbox(src, cap){
  const d=document.createElement("div"); d.className="lightbox";
  d.innerHTML=`<div><img src="${esc(src)}" alt="">${cap?`<div class="cap">${esc(cap)}</div>`:""}</div>`;
  d.onclick=()=>d.remove();
  document.body.appendChild(d);
}

/* ── browse ─────────────────────────────────────────────────────────── */
function viewBrowse(){
  const people = Object.values(IX.byId).filter(p=>!isPrivate(p));
  const branches = [...new Set(people.map(p=>(p.Branch||"").trim()).filter(Boolean))].sort();
  app().innerHTML = `
    <h1 style="margin-bottom:6px">Everyone on record</h1>
    <p class="muted" style="margin-top:0">${people.length} ${people.length===1?"person":"people"}, grouped by generation.</p>
    <div class="filters noprint">
      <input id="bq" placeholder="Filter by name…" style="min-width:200px">
      <select id="bb"><option value="">All branches</option>${branches.map(b=>`<option>${esc(b)}</option>`).join("")}</select>
    </div>
    <div id="browseOut"></div>`;
  const render = () => {
    const q=(document.getElementById("bq").value||"").toLowerCase().trim();
    const b=document.getElementById("bb").value;
    const list = people.filter(p =>
      (!b || (p.Branch||"").trim()===b) &&
      // Searching matches a spouse's name, so filtering here does too.
      (!q || [name(p),p.FullName,p.Nickname,p.OtherNames]
               .concat(spousesOf(p).map(s=>s.name)).join(" ").toLowerCase().includes(q)));
    const byGen={};
    list.forEach(p=>{ const g = marriedIn(p) ? "married-in" : (p.Generation||"—"); (byGen[g]=byGen[g]||[]).push(p); });
    const order = g => g==="married-in" ? 999 : (+g||99);
    document.getElementById("browseOut").innerHTML = Object.keys(byGen).sort((a,b)=>order(a)-order(b)).map(g=>`
      <div style="margin-bottom:26px">
        <div class="sechead"><h2>${g==="married-in" ? "Married into the family"
          : g==="—" ? "Generation not set" : `Generation ${esc(g)}`}</h2><div class="rule"></div>
          <span class="small muted">${byGen[g].length}</span></div>
        <div class="pgrid">${byGen[g].sort((x,y)=>name(x).localeCompare(name(y))).map(p=>`
          <a class="card pcard" href="#/person/${encodeURIComponent(p.PersonID)}">
            ${avatar(p)}<div><div class="nm">${esc(name(p))}</div>
            <div class="small muted">${esc([lifespan(p), p.Branch].filter(Boolean).join(" · "))||"&nbsp;"}</div></div>
          </a>`).join("")}</div>
      </div>`).join("") || `<p class="muted">Nobody matches that.</p>`;
  };
  document.getElementById("bq").oninput = render;
  document.getElementById("bb").onchange = render;
  render();
}

/* ── search ─────────────────────────────────────────────────────────── */
function viewSearch(params){
  const q0 = params.get("q") || "";
  app().innerHTML = `
    <h1 style="margin-bottom:6px">Search the family record</h1>
    <p class="muted" style="margin-top:0">Names, nicknames, places, professions, schools and stories.</p>
    <input id="sq" placeholder="Try a name, a town, or a trade…" value="${esc(q0)}" autofocus style="max-width:520px">
    <div id="sout" style="margin-top:20px"></div>`;
  const run = () => {
    const q=(document.getElementById("sq").value||"").toLowerCase().trim();
    const out=document.getElementById("sout");
    if(q.length<2){ out.innerHTML=`<p class="muted small">Type at least two letters.</p>`; return; }
    const hits=[];
    Object.values(IX.byId).filter(p=>!isPrivate(p)).forEach(p=>{
      const why=[];
      const nm=[name(p),p.FullName,p.Nickname,p.OtherNames].filter(Boolean).join(" ");
      if(nm.toLowerCase().includes(q)) why.push("name");
      if(spousesOf(p).some(sp=>sp.name.toLowerCase().includes(q))) why.push("marriage");
      if(!isLimited(p)){
        [["PLACES",r=>[r.Place,r.Country,r.PlaceType]],["OCCUPATIONS",r=>[r.Occupation,r.Employer,r.Specialisation]],
         ["EDUCATION",r=>[r.Institution,r.Qualification,r.Level]],["EVENTS",r=>[r.Title,r.Description]],
         ["STORIES",r=>[r.Title,r.Story,r.ToldBy]]].forEach(([tab,f])=>{
          if(rowsFor(tab,p.PersonID).some(r=>f(r).filter(Boolean).join(" ").toLowerCase().includes(q)))
            why.push(tab.toLowerCase());
        });
        if([p.BirthPlace,p.DeathPlace,p.BurialPlace,p.ShortBio,p.Branch].filter(Boolean).join(" ").toLowerCase().includes(q))
          why.push("profile");
      }
      if(why.length) hits.push([p,[...new Set(why)]]);
    });
    out.innerHTML = hits.length
      ? `<p class="small muted">${hits.length} ${hits.length===1?"match":"matches"}</p>
         <div class="pgrid">${hits.map(([p,why])=>`
          <a class="card pcard" href="#/person/${encodeURIComponent(p.PersonID)}">
            ${avatar(p)}<div><div class="nm">${esc(name(p))}</div>
            <div class="small muted">${esc([lifespan(p),p.Branch].filter(Boolean).join(" · "))}</div>
            <div class="small muted" style="margin-top:4px">matched in ${esc(why.join(", "))}</div></div></a>`).join("")}</div>`
      : `<p class="muted">Nothing found for “${esc(q)}”.</p>`;
  };
  document.getElementById("sq").oninput = run;
  run();
}

    return;

  const about = (params && params.get("about")) || "";
  const byName = (a,b) => name(a).localeCompare(name(b));

  // Two different lists, because they answer two different questions.
  // everyone  — who a photograph, a story or a correction can be ABOUT. A wife
  //             who married in is as much a member of the family as anyone.

      add them. You only need their name and how they connect to someone already here.</p>

        <div class="grid" style="grid-template-columns:1fr; gap:10px">

            <select name="relation" required>
              <option value="child of">child of</option>

        </div>
        <p class="small muted" style="margin:-4px 0 0">A husband or wife gets a page of their own, with their

        <div class="grid" style="grid-template-columns:1fr 1fr; gap:10px">

            <select name="gender"><option value="U">not sure</option><option value="M">man</option><option value="F">woman</option></select>
          </label>
          <label class="small">Still living?
            <select name="living"><option value="Unknown">not sure</option><option value="Yes">yes</option><option value="No">no</option></select>
          </label>
        </div>

        <div class="grid" style="grid-template-columns:1fr 1fr; gap:10px">
          <label class="small">Born (year, even roughly)<input name="birthDate" placeholder="e.g. 1948 or c.1950"></label>
          <label class="small">Born where?<input name="birthPlace" placeholder="Village, town or city"></label>
        </div>

          <label class="small">Died where?<input name="deathPlace"></label>
        </div>

          <input name="spouse" placeholder="Just the name — spouses are recorded but are not part of the line of descent"></label>

        <label class="small">Anything else worth recording
          <textarea name="notes" rows="4" placeholder="Their trade, where they lived, their children, a nickname — whatever you know."></textarea></label>

        <div class="grid" style="grid-template-columns:1fr 1fr; gap:10px">
          <label class="small">Your name<input name="from" required></label>

        </div>

        <button class="btn primary" type="submit">Send for checking</button>
        <p class="small muted" id="personMsg"></p>
      </form>
    </section>

          <label class="small">Title<input name="title" required></label>
          <label class="small">The story<textarea name="story" rows="7" required></textarea></label>
          <label class="small">Who told it?<input name="toldBy" required placeholder="The person whose account this is"></label>
          <button class="btn primary" type="submit">Send for checking</button>
          <p class="small muted" id="storyMsg"></p>
        </form>
      </section>
    </div>

    <section class="card pad" style="margin-top:16px">
      <div class="sechead"><h2>Something not right?</h2><div class="rule"></div></div>
      <p class="small muted" style="margin:0 0 14px">A name spelled differently, a wrong parent, a date that cannot be
      right, two entries for the same person — say so and it will be looked into.</p>
      <form id="fixForm" class="grid">
        <label class="small">Which person?${pick("personId", about)}</label>
        <label class="small">What should be changed?<textarea name="message" rows="4" required
          placeholder="What the record says now, and what it should say."></textarea></label>
        <div class="grid" style="grid-template-columns:1fr 1fr; gap:10px">
          <label class="small">Your name<input name="from" required></label>
          <label class="small">Your email (optional)<input name="contact" type="email"></label>
        </div>
        <button class="btn" type="submit">Send</button>
        <p class="small muted" id="fixMsg"></p>
      </form>
    </section>`;

  const wire = (formId, msgId, build, okText) => {
    const form = document.getElementById(formId);
    form.onsubmit = async ev => {
      ev.preventDefault();
      const msg = document.getElementById(msgId);
      const btn = form.querySelector("button[type=submit]");
      const payload = await build(form, msg);
      if(!payload) return;
      btn.disabled = true; msg.textContent = "Sending…";
      const ok = await post(payload);
      btn.disabled = false;
      msg.textContent = ok ? okText : "Something went wrong. Please try again in a moment.";
      if(ok) form.reset();
    };
  };

  wire("personForm", "personMsg", f => ({
    action:"suggestPerson", newName:f.newName.value, relation:f.relation.value,
    relatedId:f.relatedId.value, gender:f.gender.value, living:f.living.value,
    birthDate:f.birthDate.value, birthPlace:f.birthPlace.value,
    deathDate:f.deathDate.value, deathPlace:f.deathPlace.value,
    spouse:f.spouse.value, notes:f.notes.value, from:f.from.value, contact:f.contact.value
  }), "Thank you — sent for checking. If they are confirmed they will appear in the tree.");

  wire("photoForm", "photoMsg", async (f, msg) => {
    const file = f.file.files[0];
    if(!file){ msg.textContent = "Please choose a photograph."; return null; }
    if(file.size > 12*1024*1024){ msg.textContent = "That file is larger than 12 MB — please send a smaller version."; return null; }
    const data = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.readAsDataURL(file); });
    return {action:"uploadPhoto", personId:f.personId.value, caption:f.caption.value,
      photoDate:f.photoDate.value, place:f.place.value, uploader:f.uploader.value,
      filename:file.name, mimeType:file.type, data};
  }, "Thank you — the photograph has been sent for checking.");

  wire("storyForm", "storyMsg", f => ({
    action:"addStory", personId:f.personId.value, title:f.title.value,
    story:f.story.value, toldBy:f.toldBy.value
  }), "Thank you — the story has been sent for checking.");

  wire("fixForm", "fixMsg", f => ({
    action:"suggestCorrection", personId:f.personId.value,
    message:f.message.value, from:f.from.value, contact:f.contact.value
  }), "Thank you — that has been passed on.");
}

async function post(payload){
  try{
    const r = await fetch(CONFIG.APPS_SCRIPT_URL, {
      method:"POST", body:JSON.stringify(payload),
      headers:{"Content-Type":"text/plain;charset=utf-8"}   // avoids a CORS preflight
    });
    const j = await r.json();
    return !!j.ok;
  }catch(e){ console.error(e); return false; }
}

/* ── admin worklist (unlisted: reachable only at #/admin) ────────────
   Not linked from anywhere and not in the menu. It is not secured either —
   it holds no secrets, only summaries of what is already published — so
   treat it as a convenience, not as a private page.                     */
function viewAdmin(){
  const people = Object.values(IX.byId);
  const yr = s => year(s);
  const has = (tab,id) => rowsFor(tab,id).length > 0;

  const noName    = people.filter(p => /name unknown/i.test(p.Status||"") || /^unknown\b/i.test(name(p)));
  const noParents = people.filter(p => !parentsOf(p).length && p.PersonID !== (setting("root_person_id")||""));
  const noDates   = people.filter(p => !yr(p.BirthDate) && !yr(p.DeathDate) && !isYes(p.Living));
  const bare      = people.filter(p => !(p.ShortBio||"").trim() && !yr(p.BirthDate) &&
                        !has("PLACES",p.PersonID) && !has("OCCUPATIONS",p.PersonID) &&
                        !has("EDUCATION",p.PersonID) && !has("STORIES",p.PersonID));
  const noFlag    = people.filter(p => !isYes(p.Living) && !yr(p.DeathDate) && !(p.DeathPlace||"").trim()
                        && !/^no$/i.test((p.Living||"").trim()));
  const needsWork = people.filter(p => /needs clarification/i.test(p.Status||""));
  const pending   = PENDING;
  const married   = people.filter(p => marriedIn(p));
  const noPhoto   = people.filter(p => !profilePhoto(p));
  const withPhoto = people.length - noPhoto.length;
  const limited   = people.filter(p => isLimited(p) && !isPrivate(p));
  const priv      = people.filter(p => isPrivate(p));

  const sheetId = CONFIG.SHEET_ID || setting("sheet_id","");
  const list = (rows, empty) => rows.length
    ? `<div class="plist" style="margin-top:10px">${rows.slice(0,40).map(p=>personChip(p.PersonID,"")).join("")}
       ${rows.length>40?`<span class="chip">+${rows.length-40} more</span>`:""}</div>`
    : `<p class="small muted" style="margin:8px 0 0">${empty}</p>`;

  app().innerHTML = `
  <div class="notice noprint" style="margin-bottom:20px">
    <strong>Administrator's worklist — unlisted, not private.</strong>
    This page is not linked from the site and does not appear in the menu, but anyone who
    knows the address can open it. It shows only summaries of information already published here.
    Nothing confidential belongs on it.
  </div>

  <h1 style="margin-bottom:4px">Worklist</h1>
  <p class="muted small" style="margin-top:0">
    Reading from ${SOURCE==="sheet" ? "the published spreadsheet"
      : SOURCE==="script" ? "the Apps Script backend"
      : "the built-in fallback copy — the live spreadsheet could not be reached"}.
    ${sheetId ? `<a href="https://docs.google.com/spreadsheets/d/${esc(sheetId)}/edit" target="_blank" rel="noopener">Open the spreadsheet ↗</a>` : ""}
    <br>Build <code>${esc(BUILD)}</code> — if this is not the version you last uploaded, your browser is showing a cached copy.
  </p>

  <div class="stats" style="margin-bottom:26px">
    ${stat(people.length - married.length,"in the line")}
    ${stat(married.length,"married in")}
    ${stat(withPhoto,"with a photograph")}
    ${stat(approved(DB.STORIES||[]).length,"stories")}
    ${stat(limited.length,"living, screened")}
    ${stat(priv.length,"private")}
  </div>

  ${pending ? `<div class="notice" style="border-color:var(--green); background:var(--green-wash); color:var(--green); margin-bottom:16px">
    <strong>${pending} submission(s) waiting for your approval.</strong>
    Open the spreadsheet and use <em>Family Tree ▸ Review the approval queue</em>.
  </div>` : ""}

  ${section(`Names still to recover · ${noName.length}`,
    list(noName, "Every person on record has a name."))}

  ${section(`Not attached to a parent · ${noParents.length}`,
    `<p class="small muted" style="margin:0">These people float free of the tree. Usually a missing FatherID or MotherID.</p>
     ${list(noParents, "Everyone is attached to the tree.")}`)}

  ${section(`Marked for clarification · ${needsWork.length}`,
    list(needsWork, "Nothing is flagged."))}

  ${section(`Nothing recorded but a name · ${bare.length}`,
    `<p class="small muted" style="margin:0">No dates, places, work, schooling or stories yet. The best candidates for an elder's memory.</p>
     ${list(bare, "Everyone has something recorded.")}`)}

  ${section(`Living status not set · ${noFlag.length}`,
    `<p class="small muted" style="margin:0">Neither Living = Yes nor any death detail. Until this is set, their dates and
     places show publicly. Worth resolving before sharing the site widely.</p>
     ${list(noFlag, "Every person's living status is recorded.")}`)}

  ${section(`Still on a silhouette · ${noPhoto.length}`,
    list(noPhoto, "Everyone has a photograph."))}

  ${section("Adding someone", `
    <ol class="small" style="padding-left:18px; margin:0">
      <li>Add a row to <b>PEOPLE</b> and give them the next free Person ID.</li>
      <li>Put their father's and mother's IDs in <b>FatherID</b> and <b>MotherID</b>.</li>
      <li>Reload the site. Siblings, cousins and descendants are worked out for you.</li>
    </ol>
    <p class="small muted" style="margin:12px 0 0">Leave anything you do not know blank. Never invent a detail to fill a gap.
    The spreadsheet's <em>Family Tree</em> menu has tools for IDs, generations, branches and a full data check.</p>`)}`;
}

/* ── router ─────────────────────────────────────────────────────────── */
function route(){
  const raw = location.hash.replace(/^#\/?/,"");
  const [path, qs] = raw.split("?");
  const params = new URLSearchParams(qs||"");
  const parts = path.split("/").filter(Boolean);
  const page = parts[0] || "";

  document.querySelectorAll("nav.main a").forEach(a=>{
    const h=a.getAttribute("href").replace(/^#\/?/,"");
    if(h===page) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
  document.getElementById("nav").classList.remove("open");
  window.scrollTo(0,0);

  switch(page){
    case "": viewHome(); break;
    case "tree": viewTree(params); break;
    case "person": viewPerson(decodeURIComponent(parts[1]||"")); break;
    case "browse": viewBrowse(); break;
    case "search": viewSearch(params); break;
    case "stories": viewStories(); break;
    case "gallery": viewGallery(); break;
    case "contribute": viewContribute(params); break;
    case "admin": viewAdmin(); break;              // unlisted; never in the menu
    default: viewHome();
  }
  const p = page==="person" ? P(decodeURIComponent(parts[1]||"")) : null;
  document.title = (p ? `${name(p)} · ` : "") + setting("site_title","Odikom Family Tree");
}

/* ── staying current ────────────────────────────────────────────────
   GitHub Pages sends Cache-Control: max-age=600 and gives no way to change
   it, so a visitor who loaded the site in the last ten minutes keeps the old
   copy — and a phone that has kept the tab open can hold one far longer.
   There are no separate CSS or JS files to fingerprint with ?v=, so instead
   the page carries a build stamp and checks whether a newer one exists.     */

const BUILD = document.querySelector('meta[name=build]')?.content || "dev";
let lastCheck = 0;

async function checkForUpdate(){
  // Only meaningful for a page served over the web; opening the file directly
  // cannot fetch itself and would log an error for nothing.
  if(!/^https?:$/.test(location.protocol)) return;
  if(Date.now() - lastCheck < 60000) return;
  lastCheck = Date.now();
  try{
    // cache:"reload" bypasses the stale copy AND replaces it, so the plain
    // location.reload() below then picks up the new version.
    const r = await fetch(location.href.split("#")[0], {cache:"reload"});
    if(!r.ok) return;
    const m = (await r.text()).match(/<meta name="build" content="([^"]+)"/);
    if(m && m[1] && m[1] !== BUILD){
      const bar = document.getElementById("updateBar");
      if(bar) bar.hidden = false;
    }
  }catch(e){ /* offline, or opened from a file — nothing to do */ }
}

document.getElementById("themeBtn").onclick = () => {
  const now = document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", now);
};
document.getElementById("navToggle").onclick = () => document.getElementById("nav").classList.toggle("open");
if(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)
  document.documentElement.setAttribute("data-theme","dark");

(async function(){
  await loadAll();
  dropUnapproved();
  readSettings();
  buildIndex();
  document.getElementById("brandText").textContent = setting("site_title","Odikom Family Tree");
  document.getElementById("footNote").textContent = setting("tagline","Build Once. Grow Forever.");
  if(CONFIG.APPS_SCRIPT_URL && isYes(setting("allow_uploads","Yes")))
    document.getElementById("navContribute").hidden = false;
  console.info(`Odikom Family Tree · build ${BUILD} · source "${SOURCE}" · ${Object.keys(IX.byId).length} people`);
  document.getElementById("refreshBtn").onclick = () => location.reload();
  setTimeout(checkForUpdate, 4000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden) checkForUpdate(); });

  window.addEventListener("hashchange", route);
  var rt;
  addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(() => { if(document.querySelector(".viewport")) fitTree(); }, 180);
  });
  route();
})();
